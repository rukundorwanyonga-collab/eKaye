

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - camel_case_types
    - prefer_const_constructors
    - prefer_double_quotes
    - prefer_final_fields
    - prefer_is_empty
    - prefer_is_not_empty
    - sort_constructors_first
    - unnecessary_const
    - unnecessary_late
    - use_build_context_synchronously
    - use_key_in_widget_constructors

analyzer:
  exclude:
    - "build/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
  errors:
    avoid_print: error
    prefer_const_constructors: warning
